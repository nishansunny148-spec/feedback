<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Client Feedback Form · Sfumato</title>
    <meta
      name="description"
      content="Sfumato client feedback form. Record a voice note or type your thoughts about your project."
    />
    <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAF7" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Client Feedback Form · Sfumato" />
    <meta
      property="og:description"
      content="Record a voice note or type your thoughts below."
    />
    <meta name="twitter:card" content="summary" />

    <!-- Gotham (self-hosted, see src/index.css) -->
    <link rel="preload" href="/fonts/gotham-book.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/gotham-bold.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Noto Sans Gujarati: glyph fallback for Gujarati text (Gotham has no Gujarati) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;700&display=swap"
    />

    <script>
      (function () {
        try {
          var pref = localStorage.getItem('vf-theme');
          var dark = pref === 'dark' || (pref !== 'light' && !matchMedia('(prefers-color-scheme: light)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>This page needs JavaScript to record and send your feedback.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
